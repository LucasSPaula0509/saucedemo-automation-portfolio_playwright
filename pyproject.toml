[project]
name = "saucedemo-automation-portfolio-playwright"
version = "1.0.0"
description = "Automação front-end do Swag Labs com Python + Playwright + BDD"
requires-python = ">=3.14"

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
bdd_features_base_dir = "features"
# Log no console, no formato do Logback do projeto Java.
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s.%(msecs)03d %(levelname)-5s %(name)s - %(message)s"
log_cli_date_format = "%H:%M:%S"
addopts = [
    "--strict-markers",
    # Filtro padrão (um -m na linha de comando substitui este).
    "-m", "not defeito and not performance",
    # Allure e links de rastreabilidade (troque pelos endereços do seu gerenciador).
    "--alluredir=allure-results",
    "--clean-alluredir",
    "--allure-link-pattern=issue:https://github.com/LucasSPaula0509/saucedemo-automation-portfolio_java/issues?q={}",
    "--allure-link-pattern=tms:https://tms.example.com/browse/{}",
    # Evidências em arquivo: screenshot das falhas (test-results/) e relatório do Cucumber.
    "--screenshot=only-on-failure",
    "--output=test-results",
    "--cucumberjson=reports/cucumber.json",
]
markers = [
    "login: funcionalidade Login",
    "produtos: funcionalidade Produtos",
    "carrinho: funcionalidade Carrinho",
    "checkout: funcionalidade Checkout",
    "regressivo: faz parte da regressão funcional",
    "smoke: caminho crítico, roda primeiro no CI",
    "positivo: fluxo feliz",
    "negativo: validação de erro",
    "ordenacao: agrupamento: ordenação",
    "detalhe: agrupamento: detalhe do produto",
    "menu: agrupamento: menu lateral",
    "calculo: agrupamento: cálculo do pedido",
    "cancelamento: agrupamento: cancelamento",
    "validacao: agrupamento: campos obrigatórios",
    "seguranca: verificação de segurança (funcional no login ou passiva)",
    "passivo: verificação de segurança somente leitura",
    "performance: performance percebida; fora do filtro padrão",
    "defeito: defeito conhecido; fora do filtro padrão",
    # IDs de rastreabilidade (@CTnnn_<Funcionalidade>): registre o ID de cada cenário novo.
    "CT001_Carrinho: ID de rastreabilidade",
    "CT001_Checkout: ID de rastreabilidade",
    "CT001_Login: ID de rastreabilidade",
    "CT001_Performance: ID de rastreabilidade",
    "CT001_Produtos: ID de rastreabilidade",
    "CT001_Seguranca: ID de rastreabilidade",
    "CT002_Carrinho: ID de rastreabilidade",
    "CT002_Checkout: ID de rastreabilidade",
    "CT002_Login: ID de rastreabilidade",
    "CT002_Performance: ID de rastreabilidade",
    "CT002_Produtos: ID de rastreabilidade",
