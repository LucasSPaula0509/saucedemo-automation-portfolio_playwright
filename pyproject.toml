[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["saucedemo"]
known-third-party = ["allure"]

# Configurações do projeto (equivalente ao config.properties do Java). Cada chave pode ser
# sobrescrita por variável de ambiente: chave em maiúsculas com "_" no lugar de "." (ex.:
# TIMEOUT_SECONDS=20, PERF_LCP_MAX_MS=3000).
[tool.saucedemo]
"base.url" = "https://www.saucedemo.com"
"timeout.seconds" = 10
"window.width" = 1920
"window.height" = 1080
# Evidências: true anexa screenshot de todos os passos (padrão: só do passo que falhou).
"screenshot.every.step" = false
# Performance (@performance) - limites em milissegundos.
"perf.login.page.max.ms" = 3000
"perf.login.to.inventory.max.ms" = 2000
# Largest Contentful Paint: 2500 ms é o limite "bom" do Core Web Vitals.
"perf.lcp.max.ms" = 2500
# Segurança (@seguranca @passivo): true = achados reprovam o cenário; false = apenas registra.
"security.fail.on.findings" = false
