[project]
name = "saucedemo-automation-portfolio-playwright"
version = "1.0.0"
description = "Automação front-end do Swag Labs com Python + Playwright + BDD"
requires-python = ">=3.14"

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]
bdd_features_base_dir = "features"
addopts = [
    "--strict-markers",
    # Filtro padrão (um -m na linha de comando substitui este).
    "-m", "not defeito and not performance",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ANN", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["saucedemo"]
